<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" href="/templates/rfn/main.css" rel="stylesheet">
    <meta name="description" content="RF-Network gateway configuration UI">
	<link rel="shortcut icon" type="image/x-icon" href="/templates/rfn/favicon.ico" />
    <meta name="author" content="RF-Network">
    <title>RF-Networks</title>
    <style>
		.frame {
			top: 50%;
			left: 50%;
			height: 100%;
			display: flex;
			position: absolute;
			transform: translate(-50%, -50%);
			align-items: center;
			justify-content: center;
		}
		.panelTitle {
			width: 100%;
			-webkit-tap-highlight-color: rgba(0,0,0,0);
			color: rgba(0, 0, 0, 0.498039);
			font-size: 16px;
			transform: perspective(1px) scale(0.75) translate3d(0px, -28px, 0);
			transform-origin: left top;
			margin-bottom: 0px;
			margin-top: 40px;
		}
		.panelContent {
			width: 100%;
			border-top: none;
			border-left: none;
			border-right: none;
			outline: none;
			border-bottom: 1px solid #D1D2D3;
			background-color: transparent;
			font-size: 16px;
			padding-bottom: 5px;
			-webkit-appearance: none;
		    -moz-appearance: none;
		    appearance: none;
			align-items: center;
			font-family: "Roboto", "Helvetica", "Arial", sans-serif;
			font-weight: 400;
			line-height: 1.1876em;
			letter-spacing: 0.00938em;
		}
		.img {
			width: 376px;
		}
		.block {
			width: 420px;
			display: flex;
			align-items: center;
			flex-direction: column;
			justify-content: center;
		}
		.basicWidth {
			width: '100%';
			text-align: 'center';
			padding-top: 35px;
		}
		.submitButton {
			color: #ffffff;
			width: 100%;
			text-align: center;
			background-color: #4caf50;
			&:hover: {
			  background-color: #388e3c;
			};
			padding: 6px 8px;
			font-size: 0.875rem;
			min-width: 64px;
			box-sizing: border-box;
			transition: background-color 250ms cubic-bezier(0.4, 0, 0.2, 1) 0ms, box-shadow 250ms cubic-bezier(0.4, 0, 0.2, 1) 0ms, border 250ms cubic-bezier(0.4, 0, 0.2, 1) 0ms;
			font-family: "Roboto", "Helvetica", "Arial", sans-serif;
			font-weight: 500;
			line-height: 1.75;
			border-radius: 4px;
			letter-spacing: 0.02857em;
			text-transform: uppercase;
			border: 0;
			cursor: pointer;
			margin: 40px 0;
			display: inline-flex;
			outline: 0;
			position: relative;
			align-items: center;
			user-select: none;
			vertical-align: middle;
			justify-content: center;
			text-decoration: none;
			-webkit-appearance: none;
			-webkit-tap-highlight-color: transparent;
			}
    </style>
</head>
<body style="margin:0px;padding:0px;">
    <div class="frame">
		<div class="block">
			<div style="
			  width: 300px;
			  padding-left: 60px;
			  padding-right: 60px;
			  display: flex;
			  justify-content: center;
			  flex-direction: column;
			  align-items: center;">
				<img src="/templates/rfn/img/rf-networks.png" class="img" />
				<p style="line-height: 22px; margin-top: 40px; font-family: 'RionaSansLight,Arial,Helvetica,sans-serif';"><span style="font-family: 'RionaSansLight,Arial,Helvetica,sans-serif';">Welcome to</span> <b style="font-family: 'RionaSansMedium,Arial,Helvetica,sans-serif';">RFN Smart Gateway</b>.</p>
				{{ error_block }}
				<form method="POST" action="/cgi-bin/rfn-login" onsubmit="handleLoginSubmit(event)">
					<h3 class="panelTitle">Account</h3>
					<input type="text" id="username" name="username" class="panelContent" style="margin-top: -15px;" value="root(default)" required autofocus disabled>
					<input type="password" id="password" name="password" class="panelContent basicWidth">
					<button type="submit" class="submitButton" id="login-btn">Sign In</button>
				</form>
				<script>
					function handleLoginSubmit(event) {
						var btn = document.getElementById('login-btn');
						btn.disabled = true;
						btn.textContent = 'Signing in...';
					}
				</script>
			</div>
			<div style="width: 100%;">
		    <p style="
			  margin-top: 80px;
			  border-top: 1px solid rgba(0,0,0,0.12);
			  padding-top: 10px;
			  text-align: center;
			  ">For advanced network configuration, go to <a style="color: #00a1de; text-decoration: none;" href="/cgi-bin/luci">OpenWrt</a>.</p>
			</div>
		  </div>
		</div>
    </div>
</body>
</html>
